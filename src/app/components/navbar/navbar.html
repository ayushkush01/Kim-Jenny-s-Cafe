<header
  class="fixed top-0 w-full z-[100] bg-white/85 backdrop-blur-2xl border-b border-white/20 shadow-sm transition-all duration-300">
  <nav
    class="flex justify-between items-center px-6 lg:px-12 py-4 max-w-[1400px] mx-auto w-full font-['Inter'] antialiased relative">

    <!-- Logo -->
    <a routerLink="/" (click)="closeMobileMenu()"
      class="text-xl font-black tracking-tighter text-zinc-950 hover:text-amber-500 transition-colors flex items-center gap-2 z-50 relative">
      KIM &amp; JENNY'S
    </a>

    <!-- Desktop Navigation Links -->
    <div class="hidden md:flex items-center space-x-12">
      <a routerLink="/" routerLinkActive="text-zinc-950 font-black" [routerLinkActiveOptions]="{exact: true}"
        class="text-zinc-500 hover:text-amber-500 transition-colors text-[11px] font-bold uppercase tracking-[0.2em] relative group">
        Home
        <span class="absolute -bottom-2 left-0 w-0 h-[2px] bg-amber-500 transition-all group-hover:w-full"></span>
      </a>

      <a routerLink="/menu" routerLinkActive="text-zinc-950 font-black"
        class="text-zinc-500 hover:text-amber-500 transition-colors text-[11px] font-bold uppercase tracking-[0.2em] relative group">
        Menu
        <span class="absolute -bottom-2 left-0 w-0 h-[2px] bg-amber-500 transition-all group-hover:w-full"></span>
      </a>

      <a routerLink="/visit" routerLinkActive="text-zinc-950 font-black"
        class="text-zinc-500 hover:text-amber-500 transition-colors text-[11px] font-bold uppercase tracking-[0.2em] relative group">
        Visit
        <span class="absolute -bottom-2 left-0 w-0 h-[2px] bg-amber-500 transition-all group-hover:w-full"></span>
      </a>

      <a routerLink="/journal" routerLinkActive="text-zinc-950 font-black"
        class="text-zinc-500 hover:text-amber-500 transition-colors text-[11px] font-bold uppercase tracking-[0.2em] relative group">
        Our Story
        <span class="absolute -bottom-2 left-0 w-0 h-[2px] bg-amber-500 transition-all group-hover:w-full"></span>
      </a>

      <a routerLink="/contact" routerLinkActive="text-zinc-950 font-black"
        class="text-zinc-500 hover:text-amber-500 transition-colors text-[11px] font-bold uppercase tracking-[0.2em] relative group">
        Contact
        <span class="absolute -bottom-2 left-0 w-0 h-[2px] bg-amber-500 transition-all group-hover:w-full"></span>
      </a>
    </div>

    <!-- CTA Button & Mobile Toggle -->
    <div class="flex items-center gap-4 z-50 relative">
      <a href="https://order.toasttab.com/online/kimandjennyscafe-new-location-586-e-wheatland-rd" target="_blank"
        class="hidden sm:flex bg-zinc-950 text-white px-8 py-3.5 rounded-full font-bold hover:bg-amber-500 hover:text-white hover:shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-all active:scale-95 text-[10px] uppercase tracking-[0.2em]">
        Order Online
      </a>
      
      <!-- Mobile Menu Toggle Button (Hamburger) -->
      <button (click)="toggleMobileMenu()" class="md:hidden flex flex-col justify-center items-center w-8 h-8 space-y-1.5 focus:outline-none group">
        <span class="block w-6 h-[2px] bg-zinc-950 transition-transform duration-300 origin-center" [class.rotate-45]="isMobileMenuOpen" [class.translate-y-[8px]]="isMobileMenuOpen"></span>
        <span class="block w-6 h-[2px] bg-zinc-950 transition-opacity duration-300" [class.opacity-0]="isMobileMenuOpen"></span>
        <span class="block w-6 h-[2px] bg-zinc-950 transition-transform duration-300 origin-center" [class.-rotate-45]="isMobileMenuOpen" [class.-translate-y-[8px]]="isMobileMenuOpen"></span>
      </button>
    </div>

  </nav>

  <!-- Mobile Menu Drawer -->
  <div class="fixed inset-0 w-full h-[100dvh] bg-white/95 backdrop-blur-3xl z-40 md:hidden flex flex-col items-center justify-center space-y-8 transition-all duration-500 ease-in-out"
       [class.opacity-0]="!isMobileMenuOpen" 
       [class.pointer-events-none]="!isMobileMenuOpen"
       [class.-translate-y-full]="!isMobileMenuOpen"
       [class.opacity-100]="isMobileMenuOpen"
       [class.translate-y-0]="isMobileMenuOpen">
       
      <a routerLink="/" routerLinkActive="text-amber-500" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()" class="text-3xl font-black text-zinc-900 uppercase tracking-widest hover:text-amber-500 transition-colors">Home</a>
      <a routerLink="/menu" routerLinkActive="text-amber-500" (click)="closeMobileMenu()" class="text-3xl font-black text-zinc-900 uppercase tracking-widest hover:text-amber-500 transition-colors">Menu</a>
      <a routerLink="/visit" routerLinkActive="text-amber-500" (click)="closeMobileMenu()" class="text-3xl font-black text-zinc-900 uppercase tracking-widest hover:text-amber-500 transition-colors">Visit</a>
      <a routerLink="/journal" routerLinkActive="text-amber-500" (click)="closeMobileMenu()" class="text-3xl font-black text-zinc-900 uppercase tracking-widest hover:text-amber-500 transition-colors">Our Story</a>
      <a routerLink="/contact" routerLinkActive="text-amber-500" (click)="closeMobileMenu()" class="text-3xl font-black text-zinc-900 uppercase tracking-widest hover:text-amber-500 transition-colors">Contact</a>
      
      <div class="pt-8">
          <a href="https://order.toasttab.com/online/kimandjennyscafe-new-location-586-e-wheatland-rd" target="_blank" (click)="closeMobileMenu()"
            class="bg-amber-500 text-white px-10 py-5 rounded-full font-bold hover:bg-zinc-900 transition-all text-sm uppercase tracking-[0.2em] shadow-lg inline-block">
            Order Online Now
          </a>
      </div>
  </div>
</header>
